# datos/patrones.toml — patrones de autenticación reconocidos como muro_de_pago
# (docs/05 v3, sección "Muros", criterio 15).
#
# SIN EVIDENCIA MEDIDA: el criterio 18 (primera corrida académica real)
# todavía no se ha corrido. Los dos patrones de abajo son convenciones de
# protocolo de identidad federada -no un hallazgo de campo ni una editorial
# observada-, elegidas porque son estándares abiertos que casi cualquier
# universidad despliega en su propio dominio. Revisar y ampliar con
# evidencia real cuando el criterio 18 dé datos.
#
# docs/01 línea 155: "en la duda, el motivo es vestibulo_sin_pdf" -por eso
# esta lista se mantiene mínima a propósito: cada patrón añadido sin
# evidencia es un muro_de_pago potencialmente mal diagnosticado.

[[patrones]]
nombre = "Shibboleth SSO"
ruta_regex = "^/Shibboleth\\.sso/"
# sin "host": el IdP vive en el dominio de cada institución, el path es fijo

[[patrones]]
nombre = "CAS (Central Authentication Service)"
ruta_regex = "^/cas/login"

# M32 (2026-09-26): los patrones se evalúan contra toda la cadena de
# redirecciones, no solo contra la URL final.
#
# NO se añade idp.nature.com/authorize, aunque E15.3 de docs/08 lo vio en la
# cadena de A.6 (Nature). El mismo log lo descarta como señal de muro: la
# puerta 0 pasó por el IdP en la primera visita al host, y la puerta 1, que
# acabó en la misma página 1.4 s después, no pasó (E15.6). Tampoco el salto al
# PDF, que es donde el acceso falla. Es un intercambio de cookie de sesión, no
# un login: un patrón sobre él haría que el diagnóstico dependiera de las
# cookies del cliente, y probablemente marcaría como muro artículos abiertos.
# Además /authorize es una ruta genérica de OAuth. A.6 sigue siendo
# vestibulo_sin_pdf (tests/test_descargar.py, M32).
